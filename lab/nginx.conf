events {}

http {
    upstream php_pool {
        hash "$remote_addr:$remote_port" consistent;
        server php2shell-proof-php-1:8000;
        server php2shell-proof-php-2:8000;
        server php2shell-proof-php-3:8000;
        server php2shell-proof-php-4:8000;
        server php2shell-proof-php-5:8000;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location / {
            proxy_pass http://php_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
