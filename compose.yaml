name: php2shell-proof

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    image: php2shell-alpine-local:8.4.26
    command: ["php", "-d", "memory_limit=128M", "-S", "0.0.0.0:8000"]
    restart: unless-stopped
    deploy:
      replicas: 5
  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - php
    ports:
      - "127.0.0.1:18083:80"
    volumes:
      - ./lab/nginx.conf:/etc/nginx/nginx.conf:ro
